# Production (serveur Debian, Docker Compose, tunnel Cloudflare). Voir la section « Déploiement » du README.
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Aucun port n'est publié sur la machine : le site et Umami ne sont joignables que par
# le tunnel Cloudflare (connexion sortante du conteneur cloudflared).

name: portfolio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/portfolio
      STORAGE_DIR: /app/storage
    volumes:
      # CV et images des projets : conservés entre les déploiements.
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  umami-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
      POSTGRES_DB: umami
    volumes:
      - umami-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # Accès au SSH de la machine hôte (route ssh.domaine → ssh://host.docker.internal:22).
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - app
      - umami

volumes:
  db-data:
  storage:
  umami-data:
