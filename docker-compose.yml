# Services de développement et de test.
# La configuration de production sera ajoutée plus tard dans un fichier séparé.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # Base dédiée aux tests E2E : sans volume, repart de zéro à chaque démarrage.
  db-test:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_test
    ports:
      - "5433:5432"

  # Faux serveur SMTP : capture tous les mails envoyés.
  # Interface web : http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
